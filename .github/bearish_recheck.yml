name: Bearish Breakdown Recheck

on:
  schedule:
    # Every 15 min, 03:00-10:59 UTC = 08:30-16:29 IST, Mon-Fri.
    # Script checks market_is_open() and exits if outside 9:15-15:30 IST.
    - cron: "*/15 3-10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nse-ai-bot-bearish-recheck
  cancel-in-progress: true

jobs:
  bearish_recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bearish recheck
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python nse_bearish_breakdown_bot.py recheck

      - name: Commit updated bearish alert state
        run: |
          git config user.name "nse-ai-bot"
          git config user.email "actions@github.com"
          git add data_bearish/
          git diff --cached --quiet || git commit -m "Bearish alert state update [skip ci]"
          git pull --rebase
          git push
