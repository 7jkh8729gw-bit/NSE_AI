name: Bearish Breakdown Scan

on:
  schedule:
    # 00:35 UTC = 06:05 IST, Monday-Friday (5 min after the bullish scan)
    - cron: "35 0 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nse-ai-bot-state
  cancel-in-progress: false

jobs:
  bearish_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bearish scan
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python nse_bearish_breakdown_bot.py scan

      - name: Commit updated bearish watchlist
        run: |
          git config user.name "nse-ai-bot"
          git config user.email "actions@github.com"
          git add data_bearish/
          git diff --cached --quiet || git commit -m "Bearish watchlist update [skip ci]"
          git pull --rebase
          git push
