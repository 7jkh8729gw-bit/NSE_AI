name: Bearish Weekly Retrain

on:
  schedule:
    # 03:30 UTC Saturday = 9:00 AM IST Saturday (off market hours,
    # offset from the bullish retrain to avoid both competing for the
    # same concurrency slot at the exact same minute)
    - cron: "30 3 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nse-ai-bot-state
  cancel-in-progress: false

jobs:
  bearish_retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bearish retrain
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RETRAIN_MIN_DATE: "2026-09-08"
        run: python nse_bearish_breakdown_bot.py retrain

      - name: Commit updated bearish model weights
        run: |
          git config user.name "nse-ai-bot"
          git config user.email "actions@github.com"
          git add data_bearish/
          git diff --cached --quiet || git commit -m "Bearish weekly model retrain [skip ci]"
          git pull --rebase
          git push
